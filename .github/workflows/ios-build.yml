name: Build iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Xcode Version
        run: xcodebuild -version

      - name: Build iOS Archive (Unsigned App)
        run: |
          xcodebuild clean build \
            -project ios/RokuSportsGuide.xcodeproj \
            -scheme RokuSportsGuide \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package App Bundle into Zip / Payload
        run: |
          mkdir -p Payload
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "RokuSportsGuide.app" -type d | head -n 1)
          if [ -d "$APP_PATH" ]; then
            echo "Found app at $APP_PATH"
            cp -r "$APP_PATH" Payload/
            zip -r RokuSportsGuide.ipa Payload
          else
            echo "Error: RokuSportsGuide.app not found in DerivedData"
            exit 1
          fi

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RokuSportsGuide-iOS-App
          path: RokuSportsGuide.ipa

      - name: Create GitHub Release with .ipa Download
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.1
          name: "Roku Sports Guide iOS App v1.0.1"
          body: "Signed Ad-Hoc RokuSportsGuide.ipa"
          files: RokuSportsGuide.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
